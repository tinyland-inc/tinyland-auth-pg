name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without publishing"
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  release-contract:
    runs-on: ${{ fromJSON(vars.PRIMARY_LINUX_RUNNER_LABELS_JSON) }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: tinyland-inc/ci-templates/.github/actions/nix-setup@v2
      - name: Verify immutable release contract
        env:
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: nix develop --command just release-contract

  package:
    needs: release-contract
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    uses: tinyland-inc/ci-templates/.github/workflows/js-bazel-package.yml@61cd1338ca9dae8a25985c0a36ff7beb111449be
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      publish_mode: hosted_exception
      node_versions: '["22"]'
      publish_node_version: "22"
      pnpm_version: "10.13.1"
      metadata_check_command: nix develop --command just package-authority
      typecheck_command: nix develop --command just typecheck
      unit_test_command: nix develop --command just test-unit
      build_command: nix develop --command just build
      package_check_command: nix develop --command just package-check
      bazel_targets: "//:pkg //:typecheck //:test //:package_authority_test //:package_artifact_test //:auth_runtime_link_test //:release_contract_test"
      package_dir: ./bazel-bin/pkg
      npm_access: public
      npm_publish_mode: disabled
      github_package_name: "@tinyland-inc/tinyland-auth-pg"
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets:
      TINYLAND_GITHUB_PACKAGES_TOKEN: ${{ secrets.TINYLAND_GITHUB_PACKAGES_TOKEN }}
